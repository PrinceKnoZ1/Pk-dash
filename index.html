<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Grok Bot</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div id="offline-banner" role="status"></div>
    <div id="demo-banner">DEMO DATA</div>
    <main id="main"></main>
    <nav id="tabbar" aria-label="Tabs"></nav>
  </div>
  <div id="search-overlay">
    <div style="display:flex;gap:8px;align-items:center">
      <input type="search" placeholder="Name, symbol or mint" autocomplete="off" enterkeyhint="search">
      <button id="search-close" class="icon-btn" style="width:auto;padding:0 8px;color:#0a84ff">Cancel</button>
    </div>
    <div class="search-hits card" style="background:transparent"></div>
  </div>
  <div id="modal"></div>
  <div id="fs-screen" class="fs-screen" style="display:none"></div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
